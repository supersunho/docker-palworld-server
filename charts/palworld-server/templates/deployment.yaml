apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "palworld-server.fullname" . }}
  labels:
    app: {{ include "palworld-server.name" . }}
    chart: {{ include "palworld-server.chart" . }}
    release: {{ .Release.Name }}
spec:
  serviceName: {{ include "palworld-server.fullname" . }}
  {{- if ne (int .Values.replicaCount) 1 }}
  {{- fail "replicaCount must be 1 — Palworld is a single-server game and multiple replicas would share the same PersistentVolume" }}
  {{- end }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "palworld-server.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "palworld-server.name" . }}
        release: {{ .Release.Name }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: palworld-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
              protocol: UDP
              name: game
            - containerPort: {{ .Values.service.queryPort }}
              protocol: UDP
              name: query
            - containerPort: {{ .Values.managementService.restApiPort }}
              protocol: TCP
              name: rest-api
            - containerPort: {{ .Values.managementService.rconPort }}
              protocol: TCP
              name: rcon
            {{- if or (eq .Values.monitoring.mode "prometheus") (eq .Values.monitoring.mode "both") }}
            - containerPort: {{ .Values.monitoring.dashboardPort }}
              protocol: TCP
              name: dashboard
            {{- end }}
          env:
            - name: SERVER_NAME
              value: {{ .Values.server.name | quote }}
            - name: SERVER_PASSWORD
              value: {{ .Values.server.password | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret | default (printf "%s-password" (include "palworld-server.fullname" .)) }}
                  key: {{ .Values.server.adminPasswordKey }}
            - name: MAX_PLAYERS
              value: {{ .Values.server.maxPlayers | quote }}
            - name: SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: QUERY_PORT
              value: {{ .Values.service.queryPort | quote }}
            - name: SERVER_DESCRIPTION
              value: {{ .Values.server.description | quote }}
            - name: REST_API_ENABLED
              value: {{ .Values.restApi.enabled | quote }}
            - name: REST_API_PORT
              value: {{ .Values.managementService.restApiPort | quote }}
            - name: RCON_ENABLED
              value: {{ .Values.rcon.enabled | quote }}
            - name: RCON_PORT
              value: {{ .Values.managementService.rconPort | quote }}
            - name: MONITORING_MODE
              value: {{ .Values.monitoring.mode }}
            - name: LOG_LEVEL
              value: {{ .Values.monitoring.logLevel }}
            - name: DASHBOARD_PORT
              value: {{ .Values.monitoring.dashboardPort | quote }}
            - name: BACKUP_ENABLED
              value: {{ .Values.backup.enabled | quote }}
            - name: BACKUP_INTERVAL
              value: {{ .Values.backup.interval | quote }}
            - name: BACKUP_RETENTION_DAYS
              value: {{ .Values.backup.retentionDays | quote }}
            - name: DISCORD_ENABLED
              value: {{ .Values.discord.enabled | quote }}
            - name: DISCORD_WEBHOOK_URL
              value: {{ .Values.discord.webhookUrl | quote }}
            - name: USE_MULTITHREAD_FOR_DS
              value: {{ .Values.performance.useMultiThread | quote }}
            - name: USE_PERFORMANCE_THREADS
              value: {{ .Values.performance.usePerformanceThreads | quote }}
            {{- if .Values.performance.workerThreads }}
            - name: WORKER_THREADS_COUNT
              value: {{ .Values.performance.workerThreads | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.dataPath }}
            - name: backups
              mountPath: {{ .Values.persistence.backupPath }}
            - name: logs
              mountPath: {{ .Values.persistence.logPath }}
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck
                - --json
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "palworld-server.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: backups
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "palworld-server.fullname" . }}-backups
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: logs
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "palworld-server.fullname" . }}-logs
        {{- else }}
          emptyDir: {}
        {{- end }}
