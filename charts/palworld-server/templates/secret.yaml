{{- if not .Values.server.existingSecret -}}
{{- $password := .Values.server.adminPassword -}}
{{- if not $password -}}
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-password" (include "palworld-server.fullname" .))) -}}
  {{- if $existingSecret -}}
    {{- $password = index $existingSecret.data .Values.server.adminPasswordKey | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 24 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "palworld-server.fullname" . }}-password
  labels:
    app: {{ include "palworld-server.name" . }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.server.adminPasswordKey }}: {{ $password | quote }}
{{- end -}}
