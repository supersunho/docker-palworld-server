apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "palworld-server.fullname" . }}-test-connection"
  labels:
    app: {{ include "palworld-server.name" . }}
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: healthcheck
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command:
        - /usr/local/bin/healthcheck
      env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.server.existingSecret | default (printf "%s-password" (include "palworld-server.fullname" .)) }}
              key: {{ .Values.server.adminPasswordKey }}
  restartPolicy: Never
