apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "palworld-server.fullname" . }}-test-connection"
  labels:
    app: {{ include "palworld-server.name" . }}
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: healthcheck
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command:
        - python3
        - -c
      args:
        - |
          import socket, sys
          service = "{{ include "palworld-server.fullname" . }}"
          port = {{ .Values.server.port }}
          rcon_port = {{ .Values.managementService.rconPort }}
          rest_port = {{ .Values.managementService.restApiPort }}
          mgmt_enabled = {{ .Values.managementService.enabled | ternary "True" "False" }}
          failures = 0

          # Game port — UDP send to verify endpoint reachability
          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.settimeout(5)
              sock.connect((service, port))
              sock.send(b"\x00")
              sock.close()
              print(f"OK - Game service {service}:{port} UDP reachable")
          except Exception as e:
              print(f"FAIL - Game service {service}:{port} UDP: {e}")
              failures += 1

          # RCON port — TCP connect
          if mgmt_enabled:
              mgmt_service = "{{ include "palworld-server.fullname" . }}-management"
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(5)
                  sock.connect((mgmt_service, rcon_port))
                  sock.close()
                  print(f"OK - RCON {mgmt_service}:{rcon_port} TCP reachable")
              except Exception as e:
                  print(f"FAIL - RCON {mgmt_service}:{rcon_port} TCP: {e}")
                  failures += 1
          else:
              print("SKIP - RCON disabled")

          if mgmt_enabled:
              try:
                  mgmt_service = "{{ include "palworld-server.fullname" . }}-management"
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(5)
                  sock.connect((mgmt_service, rest_port))
                  sock.close()
                  print(f"OK - Management REST {mgmt_service}:{rest_port} TCP reachable")
              except Exception as e:
                  print(f"FAIL - Management REST {mgmt_service}:{rest_port} TCP: {e}")
                  failures += 1
          else:
              print("SKIP - Management service disabled")
          sys.exit(0 if failures == 0 else 1)
  restartPolicy: Never
