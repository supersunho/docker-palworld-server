name: 🧪 Test Suite

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🐍 Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: 📦 Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: 🧪 Run tests with coverage
              run: |
                  python -m pytest --tb=short --cov=src --cov=scripts --cov-report=term --cov-fail-under=68

            - name: 📊 Check src coverage gate (75%)
              if: always()
              run: |
                  python -m pytest --tb=short --cov=src --cov-report=term --cov-fail-under=75 -q 2>&1 | tail -3

            - name: 🔍 Lint check (flake8)
              run: |
                  python -m flake8 src/ scripts/ tests/ --max-line-length=100 --extend-ignore=E203,W503 --per-file-ignores="src/config/base.py:F401,F811"
