[supervisord]
nodaemon=true
user=root
logfile=/home/steam/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ============================================================
# Python Manager — Main orchestrator (server_manager.py)
# Handles API, monitoring, idle restart, config, backup scheduling
# If this crashes, supervisor auto-restarts it.
# ============================================================
[program:python-manager]
command=python -m src.server_manager
directory=/app
user=steam
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=60
stdout_logfile=/home/steam/logs/manager.log
stderr_logfile=/home/steam/logs/manager_error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=PYTHONPATH="/app/src",
    PYTHONUNBUFFERED="1",
    USE_PERFORMANCE_THREADS="%(ENV_USE_PERFORMANCE_THREADS)s",
    QUERY_PORT="%(ENV_QUERY_PORT)s",
    RCON_ENABLED="%(ENV_RCON_ENABLED)s",
    REST_API_ENABLED="%(ENV_REST_API_ENABLED)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s"
priority=200

# ============================================================
# Metrics Exporter — Prometheus metrics (Phase 2)
# Standalone process so metrics keep running even during restart
# ============================================================
[program:metrics-exporter]
command=python -m src.monitoring.metrics_collector
directory=/app
user=steam
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/home/steam/logs/metrics_exporter.log
stderr_logfile=/home/steam/logs/metrics_exporter_error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=PYTHONPATH="/app/src",
    PYTHONUNBUFFERED="1",
    MONITORING_MODE="%(ENV_MONITORING_MODE)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s"
priority=400

# ============================================================
# Health Monitor — Periodic health checks
# ============================================================
[program:health-monitor]
command=python -m src.utils.health_manager
directory=/app
user=steam
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/home/steam/logs/health.log
stderr_logfile=/home/steam/logs/health_error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=PYTHONPATH="/app/src",
    PYTHONUNBUFFERED="1",
    HEALTH_CHECK_INTERVAL="%(ENV_HEALTH_CHECK_INTERVAL)s",
    HEALTH_CHECK_ENABLED="%(ENV_HEALTH_CHECK_ENABLED)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s"
priority=300

# ============================================================
# Backup Scheduler — Periodic backup creation
# ============================================================
[program:backup-scheduler]
command=python -m src.backup.backup_manager
directory=/app
user=steam
autostart=true
autorestart=true
startretries=1
startsecs=5
stdout_logfile=/home/steam/logs/backup.log
stderr_logfile=/home/steam/logs/backup_error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=PYTHONPATH="/app/src",
    PYTHONUNBUFFERED="1",
    BACKUP_INTERVAL="%(ENV_BACKUP_INTERVAL)s",
    BACKUP_RETENTION_DAYS="%(ENV_BACKUP_RETENTION_DAYS)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s"
priority=500
