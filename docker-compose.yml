version: "3.8"

services:
    palworld-server:
        image: supersunho/palworld-server:latest
        container_name: palworld-server
        hostname: palworld-server
        restart: unless-stopped
        env_file:
            - .env.palworld
        ports:
            - "${SERVER_PORT:-8211}:${SERVER_PORT:-8211}/udp" # Game server port
            - "${QUERY_PORT:-27018}:${QUERY_PORT:-27018}/udp" # Steam query port
            - "127.0.0.1:${REST_API_PORT:-8212}:${REST_API_PORT:-8212}/tcp" # REST API port (localhost only)
            - "127.0.0.1:9090:9090/tcp" # Prometheus metrics (localhost only)

        volumes:
            - ./palworld_data:/home/steam/palworld_server
            - ./palworld_backups:/home/steam/backups
            - ./palworld_logs:/home/steam/logs
            - /etc/localtime:/etc/localtime:ro

        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 5m

        deploy:
            resources:
                limits:
                    memory: 8G
                    cpus: "4"
                reservations:
                    memory: 4G
                    cpus: "2"

        logging:
            driver: "json-file"
            options:
                max-size: "50m"
                max-file: "5"

    prometheus:
        image: prom/prometheus:v2.53.0
        container_name: palworld-prometheus
        hostname: palworld-prometheus
        restart: unless-stopped
        ports:
            - "127.0.0.1:9091:9090" # Prometheus UI (localhost only)
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./palworld_prometheus:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
        depends_on:
            palworld-server:
                condition: service_healthy

    grafana:
        image: grafana/grafana:11.3.0
        container_name: palworld-grafana
        hostname: palworld-grafana
        restart: unless-stopped
        ports:
            - "127.0.0.1:3000:3000" # Grafana UI (localhost only)
        env_file:
            - .env.grafana
        volumes:
            - ./docker/grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
            - ./docker/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/providers.yml:ro
            - ./docker/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/palworld.json:ro
            - ./palworld_grafana:/var/lib/grafana
        depends_on:
            prometheus:
                condition: service_started
