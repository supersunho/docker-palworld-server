version: "3.8"

services:
    palworld-server:
        image: supersunho/palworld-server:latest
        container_name: palworld-server
        hostname: palworld-server
        restart: unless-stopped
        env_file:
            - .env.palworld
        ports:
            - "${SERVER_PORT:-8211}:${SERVER_PORT:-8211}/udp" # Game server port
            - "${QUERY_PORT:-27018}:${QUERY_PORT:-27018}/udp" # Steam query port
            - "127.0.0.1:${REST_API_PORT:-8212}:${REST_API_PORT:-8212}/tcp" # REST API port (localhost only)

        volumes:
            - ./palworld_data:/home/steam/palworld_server
            - ./palworld_backups:/home/steam/backups
            - ./palworld_logs:/home/steam/logs
            - /etc/localtime:/etc/localtime:ro

        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 5m

        deploy:
            resources:
                limits:
                    memory: 8G
                    cpus: "4"
                reservations:
                    memory: 4G
                    cpus: "2"

        logging:
            driver: "json-file"
            options:
                max-size: "50m"
                max-file: "5"
